<article class="project-card glass" data-category="{{CATEGORY}}">
  <a class="project-visual project-visual--{{THEME}}" href="{{URL}}" aria-label="View case study: {{TITLE}}">
    <span class="visual-label">{{CATEGORY_LABEL}}</span>
    <strong>{{VISUAL_TITLE}}</strong>
    <small>{{SERVICES}}</small>
  </a>
  <div class="project-body">
    <div class="project-meta">{{META}}</div>
    <h3><a href="{{URL}}">{{TITLE}}</a></h3>
    <p>{{DESCRIPTION}}</p>
    <div class="tags">{{TAGS}}</div>
    <a class="text-link" href="{{URL}}">View case study <span>↗</span></a>
  </div>
</article>
